# Netlify configuration for Zenith
# Standard client-only React SPA built with Vite, from the monorepo root (apps/app).

[build]
  command = "npm install && npm run build -w @zenith/app"
  publish = "apps/app/dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the HTML shell so new deploys are picked up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback so deep links resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
