[package]
name = "zenith-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Embedded, local-network change replication for Zenith"

[dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
thiserror = "2"
x509-parser = "0.18"
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
mdns-sd = "0.21.5"
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"
automerge = "0.12"
yrs = "0.28"
serde_json = "1"
proptest = "1"

[[bench]]
name = "merge"
harness = false
