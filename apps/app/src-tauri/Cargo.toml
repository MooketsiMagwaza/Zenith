[package]
name = "zenith-app"
version = "0.1.0"
description = "Zenith: the full app in a desktop window."
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "zenith_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
