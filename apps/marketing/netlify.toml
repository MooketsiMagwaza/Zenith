# Netlify settings for the marketing site (a separate Netlify site from the web app).
# In the Netlify UI: Base directory empty (the repository root), Package directory apps/marketing.
# Netlify then reads this file, installs from the root, and runs the build there. See docs/DEPLOY.md.

[build]
  command = "npm run build -w @zenith/marketing"
  publish = "apps/marketing/dist"

[build.environment]
  NODE_VERSION = "20"
  # ZENITH_APP_URL = "https://your-app-address"   # set it here or in the UI once the app is deployed

# Fonts, styles and captures: hashed or rarely changed, so cache them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "interest-cohort=()"
    Content-Security-Policy = "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
